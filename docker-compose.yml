version: '3.8'

services:
  meu-postgres:
    image: postgres:15-alpine
    container_name: db_controle_sistema
    environment:
      POSTGRES_DB: controle_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
    ports:
      - "5432:5432"
    volumes:
      - dados-postgres:/var/lib/postgresql/data


  meu-sistema:
    build: .
    container_name: app_controle_sistema
    ports:
      - "8080:8080"
    depends_on:
      - meu-postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://meu-postgres:5432/controle_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

volumes:
  dados-postgres: