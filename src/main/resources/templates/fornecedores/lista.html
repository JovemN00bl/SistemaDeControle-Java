<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Fornecedores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="#">Sistema de Gestão</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/produtos}">Produtos</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/clientes}">Clientes</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/vendas}">Vendas</a></li>
                <li class="nav-item"><a class="nav-link" href="/usuarios">Usuarios</a></li>
                <li class="nav-item"><a class="nav-link active" href="/fornecedores">Fornecedores</a></li>
            </ul>
            <form th:action="@{/logout}" method="post" class="d-flex">
                <button class="btn btn-outline-danger btn-sm" type="submit">Sair</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Fornecedores</h2>
        <a href="/fornecedores/novo" class="btn btn-primary">+ Novo Fornecedor</a>
    </div>

    <table class="table table-striped bg-white shadow-sm">
        <thead class="table-dark">
        <tr>
            <th>Nome</th>
            <th>CNPJ/CPF</th>
            <th>Telefone</th>
            <th>Email</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="f : ${fornecedores}">
            <td th:text="${f.nome}">Fornecedor X</td>
            <td th:text="${f.cnpj}">00.000.000/0001-00</td>
            <td th:text="${f.telefone}">(11) 9999-9999</td>
            <td th:text="${f.email}">contato@fornecedor.com</td>

            <td>
                <a th:href="@{/fornecedores/editar/{id}(id=${f.id})}" class="btn btn-sm btn-warning" >Editar</a>
                <a th:href="@{/fornecedores/excluir/{id}(id=${f.id})}" class="btn btn-sm btn-danger" >excluir</a>

            </td>
        </tr>
        <tr th:if="${fornecedores.isEmpty()}">
            <td colspan="4" class="text-center">Nenhum fornecedor cadastrado.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
