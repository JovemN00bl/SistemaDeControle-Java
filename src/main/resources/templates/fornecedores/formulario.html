<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Novo Fornecedor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <h2>Cadastro de Fornecedor</h2>
    <form th:action="@{/fornecedores/salvar}" th:object="${fornecedor}" method="post" class="card p-4 shadow-sm">

        <div class="mb-3">
            <label>Razão Social / Nome:</label>
            <input type="text" th:field="*{nome}" class="form-control" required>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label>CNPJ/CPF:</label>
                <input type="text" th:field="*{cnpj}" class="form-control" placeholder="00.000.000/0001-00">
            </div>
            <div class="col-md-6 mb-3">
                <label>Telefone:</label>
                <input type="text" th:field="*{telefone}" class="form-control">
            </div>
        </div>

        <div class="mb-3">
            <label>Email:</label>
            <input type="email" th:field="*{email}" class="form-control">
        </div>

        <div>
            <button type="submit" class="btn btn-success">Salvar</button>
            <a href="/fornecedores" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
