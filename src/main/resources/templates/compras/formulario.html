<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nova Compra (Entrada)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">Sistema de Gestão</a>
    </div>
</nav>

<div class="container">
    <h2>Nova Entrada de Estoque</h2>

    <form th:action="@{/compras/salvar}" th:object="${compra}" method="post" class="card p-4 shadow-sm mt-3" id="formCompra">

        <div class="row mb-4">
            <div class="col-md-6">
                <label class="form-label">Fornecedor:</label>
                <select th:field="*{fornecedor}" class="form-select" required>
                    <option value="">Selecione um fornecedor...</option>
                    <option th:each="f : ${fornecedores}"
                            th:value="${f.id}"
                            th:text="${f.nome}">Fornecedor A</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Data (Automática):</label>
                <input type="text" class="form-control" value="Hoje" disabled>
                <small class="text-muted">A data será registrada ao salvar.</small>
            </div>
        </div>

        <hr>

        <h5 class="mb-3">Itens da Compra</h5>
        <div class="row align-items-end bg-white p-3 border rounded mb-3">
            <div class="col-md-4">
                <label>Produto:</label>
                <select id="selectProduto" class="form-select">
                    <option value="">Escolha...</option>
                    <option th:each="p : ${produtos}"
                            th:value="${p.id}"
                            th:text="${p.nome}"
                            th:data-custo="${p.precoCusto}">Produto X</option>
                </select>
            </div>
            <div class="col-md-2">
                <label>Qtd:</label>
                <input type="number" id="inputQtd" class="form-control" value="1" min="1">
            </div>
            <div class="col-md-3">
                <label>Custo Unit. (R$):</label>
                <input type="number" id="inputCusto" class="form-control" step="0.01" placeholder="0,00">
            </div>
            <div class="col-md-3">
                <button type="button" class="btn btn-primary w-100" onclick="adicionarItem()">
                    <i class="bi bi-plus-circle"></i> Adicionar
                </button>
            </div>
        </div>

        <table class="table table-striped table-hover">
            <thead class="table-dark">
            <tr>
                <th>Produto</th>
                <th>Quantidade</th>
                <th>Custo Unit.</th>
                <th>Subtotal</th>
                <th>Ação</th>
            </tr>
            </thead>
            <tbody id="listaItens">
            </tbody>
            <tfoot>
            <tr>
                <td colspan="3" class="text-end fw-bold">TOTAL DA NOTA:</td>
                <td colspan="2" class="fw-bold text-success fs-5" id="totalNota">R$ 0,00</td>
            </tr>
            </tfoot>
        </table>

        <div class="d-flex justify-content-end mt-4">
            <a href="/compras" class="btn btn-secondary me-2">Cancelar</a>
            <button type="submit" class="btn btn-success btn-lg">
                <i class="bi bi-check-lg"></i> Finalizar Entrada
            </button>
        </div>

    </form>
</div>

<script>
    let itemIndex = 0;
    let totalGeral = 0;

    document.getElementById('selectProduto').addEventListener('change', function() {
        const option = this.options[this.selectedIndex];
        const custo = option.getAttribute('data-custo');
        if(custo) {
            document.getElementById('inputCusto').value = custo;
        }
    });

    function adicionarItem() {
        const selectProd = document.getElementById('selectProduto');
        const produtoId = selectProd.value;
        const produtoNome = selectProd.options[selectProd.selectedIndex].text;
        const qtd = parseInt(document.getElementById('inputQtd').value);
        const custo = parseFloat(document.getElementById('inputCusto').value);

        if (!produtoId || !qtd || !custo) {
            alert("Preencha todos os campos do item!");
            return;
        }

        const subtotal = qtd * custo;
        totalGeral += subtotal;

        const tbody = document.getElementById('listaItens');
        const tr = document.createElement('tr');

        tr.innerHTML = `
            <td>
                ${produtoNome}
                <input type="hidden" name="itens[${itemIndex}].produto.id" value="${produtoId}">
            </td>
            <td>
                ${qtd}
                <input type="hidden" name="itens[${itemIndex}].quantidade" value="${qtd}">
            </td>
            <td>
                R$ ${custo.toFixed(2)}
                <input type="hidden" name="itens[${itemIndex}].precoCustoUnitario" value="${custo}">
            </td>
            <td>
                R$ ${subtotal.toFixed(2)}
            </td>
            <td>
                <button type="button" class="btn btn-danger btn-sm" onclick="removerItem(this, ${subtotal})">
                    <i class="bi bi-trash"></i>
                </button>
            </td>
        `;

        tbody.appendChild(tr);
        document.getElementById('totalNota').innerText = totalGeral.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'});

        itemIndex++;
        document.getElementById('inputQtd').value = 1;
        document.getElementById('selectProduto').value = "";
        document.getElementById('inputCusto').value = "";
        document.getElementById('selectProduto').focus();
    }

    function removerItem(btn, valorSubtotal) {
        const linha = btn.closest('tr');
        linha.remove();

        totalGeral -= valorSubtotal;
        document.getElementById('totalNota').innerText = totalGeral.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'});
    }
</script>

</body>
</html>
