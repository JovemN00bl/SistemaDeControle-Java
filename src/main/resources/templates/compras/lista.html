<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Histórico de Entradas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">Sistema de Gestão</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/produtos">Produtos</a></li>
                <li class="nav-item"><a class="nav-link" href="/clientes">Clientes</a></li>
                <li class="nav-item"><a class="nav-link" href="/vendas">Vendas</a></li>
                <li class="nav-item"><a class="nav-link" href="/usuarios">Usuarios</a></li>
                <li class="nav-item"><a class="nav-link" href="/fornecedores">Fornecedores</a></li>
                <li class="nav-item"><a class="nav-link active" href="/compras">Compras</a></li>
            </ul>
            <form th:action="@{/logout}" method="post" class="d-flex">
                <button class="btn btn-outline-danger btn-sm" type="submit">Sair</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Histórico de Compras</h2>
        <a href="/compras/nova" class="btn btn-success"><i class="bi bi-plus-lg"></i> Nova Entrada</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-striped table-hover mb-0">
                <thead class="table-dark">
                <tr>
                    <th># ID</th>
                    <th>Data</th>
                    <th>Fornecedor</th>
                    <th>Valor Total</th>
                    <th>Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="compra : ${compras}">
                    <td th:text="${compra.id}">1</td>
                    <td th:text="${#temporals.format(compra.dataCompra, 'dd/MM/yyyy HH:mm')}">01/01/2025</td>
                    <td th:text="${compra.fornecedor.nome}">Fornecedor X</td>

                    <td th:text="${#numbers.formatCurrency(compra.valorTotal)}" class="fw-bold text-danger">R$ 500,00</td>

                    <td>
                        <button class="btn btn-sm btn-outline-secondary" disabled>
                            <i class="bi bi-eye"></i> Ver Itens
                        </button>
                    </td>
                </tr>
                <tr th:if="${compras.isEmpty()}">
                    <td colspan="5" class="text-center py-4">Nenhuma compra registrada.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
