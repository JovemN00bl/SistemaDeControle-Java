<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ops! Algo deu errado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-5">
    <div class="container">
        <a class="navbar-brand" href="/">Sistema de Gestão</a>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center">

            <div class="mb-4 text-danger">
                <i class="bi bi-exclamation-triangle-fill" style="font-size: 5rem;"></i>
            </div>

            <h1 class="display-4 fw-bold text-dark">Ops!</h1>

            <p class="lead text-secondary mt-3" th:text="${mensagem}">
                Ocorreu um erro inesperado.
            </p>

            <hr class="my-4">

            <p>Não se preocupe, nossa equipe técnica (você) já foi notificada.</p>

            <div class="d-grid gap-2 d-sm-flex justify-content-sm-center mt-4">
                <a href="/" class="btn btn-primary btn-lg px-4 gap-3">
                    <i class="bi bi-house-door"></i> Voltar para Home
                </a>
                <button onclick="history.back()" class="btn btn-outline-secondary btn-lg px-4">
                    Tentar Novamente
                </button>
            </div>

        </div>
    </div>
</div>

</body>
</html>
